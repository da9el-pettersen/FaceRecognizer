name: Face Recognizer
version: "0.3.0"
slug: face_recognizer
# Ferdigbygd image (se .github/workflows/publish-addons.yml). Taggen er versjonen under.
image: ghcr.io/da9el-pettersen/facerecognizer-recognition
description: Ansiktsgjenkjenning og liveness fra Reolink-kamera, resultat via MQTT
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Supervisor gir MQTT-tilkobling automatisk (Mosquitto-appen), ingen passord i imaget
services:
  - mqtt:need
# /config i appen = addon_config (vedvarende). Referansebilder ligger i /config/faces/<navn>/
map:
  - addon_config:rw
options:
  camera:
    name: "inngang"
    base_url: "https://kamera.local"
    username: ""
    password: ""
    certificate_sha256: ""
    channel: 0
    stream: "main"
    rtsp_url: ""
  stream:
    fps: 5
    max_width: 1280
  face:
    provider: "DeepFace"
    threshold: 0.62
  deepface:
    base_url: "http://def5d25e-deepface:5000"
    auth_token: ""
    model_name: "SFace"
    threshold: 0.5
  liveness:
    min_score: 0.8
    required: true
    min_live_fraction: 0.6
  pipeline:
    cooldown: "00:00:00"
    window: "00:00:03"
    min_frames: 8
  # Intern API (/internal/embed) som Admin-tjenesten bruker. Tomt token = av.
  api:
    token: ""
    url: "http://+:8099"
  # Database-tjenesten (eget image, se README).
  database:
    base_url: "http://def5d25e-face-database:8080"
    token: ""
schema:
  camera:
    name: str
    base_url: url
    username: str
    password: password
    certificate_sha256: str
    channel: int(0,)
    stream: list(main|sub)
    rtsp_url: str?
  stream:
    fps: int(1,15)
    max_width: int(320,3840)
  face:
    provider: list(FaceAiSharp|DeepFace)
    threshold: float(0.5,1)
  deepface:
    base_url: url
    auth_token: password
    model_name: str
    threshold: float(0.1,1)
  liveness:
    min_score: float(0,1)
    required: bool
    min_live_fraction: float(0,1)
  pipeline:
    cooldown: str
    window: str
    min_frames: int(3,30)
  api:
    token: password
    url: str
  database:
    base_url: url
    token: password
